<title>Карманный бюджет</title>
<style>
/* Layout: iOS-style app — large titles, inset grouped cards, floating Liquid Glass tab bar; screens push/pop with motion */
:root{
  --bg:#000000; --surface:#111113; --surface2:#1C1C1F; --fg:#FFFFFF; --muted:#8C8C92; --line:rgba(255,255,255,.08); --soft:#1C1C1F; --fill:rgba(255,255,255,.08); --track:rgba(120,120,128,.36);

}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --surface:#F4F4F6; --surface2:#EAEAEE; --fg:#000000; --muted:#7A7A80; --line:rgba(0,0,0,.07); --soft:#EAEAEE; --fill:rgba(0,0,0,.05); --track:rgba(120,120,128,.18);
  --tint:#000000; --on-tint:#FFFFFF; --link:#000000; --inc:#12A866; --exp:#E23A4E; --warn:#E0901A; --exp-soft:rgba(226,58,78,.10); --inc-soft:rgba(18,168,102,.10);
  --glass:rgba(255,255,255,.72); --glass-rim:rgba(0,0,0,.12); --glass-hi:rgba(255,255,255,.95); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F4F4F6; --surface2:#EAEAEE; --fg:#000000; --muted:#7A7A80; --line:rgba(0,0,0,.07); --soft:#EAEAEE; --fill:rgba(0,0,0,.05); --track:rgba(120,120,128,.18);
  --tint:#000000; --on-tint:#FFFFFF; --link:#000000; --inc:#12A866; --exp:#E23A4E; --warn:#E0901A; --exp-soft:rgba(226,58,78,.10); --inc-soft:rgba(18,168,102,.10);
  --glass:rgba(255,255,255,.72); --glass-rim:rgba(0,0,0,.12); --glass-hi:rgba(255,255,255,.95); color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em;min-height:100%;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

button{cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
html,body{height:100%;overflow:hidden}
.wrap{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(6px + env(safe-area-inset-top,0px)) 0}
.wrap>.notice{flex:none}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:calc(110px + var(--sab,env(safe-area-inset-bottom,0px)));margin-inline:-4px;padding-inline:4px}
#screen::-webkit-scrollbar{display:none}
/* home is a fixed one-screen layout: only the operations list scrolls */
#screen.fit,#screen.fit.enter,#screen.fit.push,#screen.fit.pop{overflow:hidden;display:flex;flex-direction:column;padding-bottom:calc(88px + var(--sab,env(safe-area-inset-bottom,0px)))}

  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}

/* mic orb scales to whatever height is left, never overlapping neighbours */
#screen.fit .voice{display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;align-items:center}

@media (max-height:700px){#screen.fit .mline{display:none}#screen.fit .acts4{margin-top:8px;gap:2px}#screen.fit .acts4 button{font-size:11px;gap:3px}#screen.fit .acts4 i{width:36px;height:36px}#screen.fit .acts4 svg{width:18px;height:18px}#screen.fit .voice{padding-top:6px}#screen.fit .mic svg{width:36px;height:36px}#screen.fit .hero .bal{font-size:40px}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-hi),0 0 0 .5px var(--glass-rim),0 10px 30px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:2px}

.gbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 2px 12px;line-height:1.1}

.hdr button{border:0;background:none;color:var(--link);font-weight:600;font-size:15px;text-transform:none;letter-spacing:-.01em;padding:0}

.accs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -16px -2px;padding:0 16px 2px}

/* voice */
.voice{display:grid;justify-items:center;gap:10px;padding:22px 0 8px}
.micw{position:relative;width:88px;height:88px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--tint);opacity:0}
.mic{position:relative;width:88px;height:88px;border-radius:50%;border:0;color:var(--on-tint);display:grid;place-items:center;background:var(--tint);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.35),0 0 0 6px var(--fill);transition:transform .45s var(--spring),background .3s,color .3s}
.mic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic:active{transform:scale(.9)}
/* voice orb — layered colour blobs drifting inside a glass sphere */
.mic{background:radial-gradient(circle at 50% 55%,#15151a,#000 75%)!important;color:#fff!important;overflow:hidden;isolation:isolate;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 14px 44px rgba(33,195,122,.28),0 0 70px rgba(94,155,255,.22)!important}
.orb{position:absolute;inset:-8%;border-radius:50%;animation:orbspin 18s linear infinite;will-change:transform}
.orb i{position:absolute;width:70%;height:70%;border-radius:50%;opacity:.95;will-change:transform;animation:var(--a) var(--d,7s) ease-in-out infinite}
.orb i:nth-child(1){background:radial-gradient(circle,#21C37A 0,rgba(33,195,122,.55) 35%,rgba(33,195,122,0) 70%);left:0;top:12%;--a:o1}
.orb i:nth-child(2){background:radial-gradient(circle,#5E9BFF 0,rgba(94,155,255,.55) 35%,rgba(94,155,255,0) 70%);right:-2%;top:2%;--a:o2;--d:8s}
.orb i:nth-child(3){background:radial-gradient(circle,#B48CFF 0,rgba(180,140,255,.55) 35%,rgba(180,140,255,0) 70%);left:18%;bottom:-2%;--a:o3;--d:9s}
.orb i:nth-child(4){background:radial-gradient(circle,#3FD0C9 0,rgba(63,208,201,.5) 35%,rgba(63,208,201,0) 70%);width:48%;height:48%;left:30%;top:30%;--a:o4;--d:5s}
.paused .orb,.paused .orb i,.paused .on .mic,.paused .ring{animation-play-state:paused!important}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes o1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(28%,-14%) scale(1.18)}66%{transform:translate(8%,22%) scale(.86)}}
@keyframes o2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-26%,24%) scale(.88)}70%{transform:translate(-8%,-10%) scale(1.2)}}
@keyframes o3{0%,100%{transform:translate(0,0) scale(1)}30%{transform:translate(16%,-26%) scale(1.15)}60%{transform:translate(-20%,-6%) scale(.9)}}

.mic::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 115%,rgba(0,0,0,.55),transparent 58%);
  box-shadow:inset 0 -8px 18px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.25)}
.mic .mi{position:relative;z-index:2;display:grid;place-items:center;transition:transform .4s var(--spring),opacity .3s}

/* listening: faster, brighter, breathing */
.on .orb{animation-duration:4s}

.on .ring{background:radial-gradient(circle,rgba(94,155,255,.0) 40%,rgba(94,155,255,.55) 62%,rgba(33,195,122,.35) 75%,transparent 78%);animation:ring 1.8s var(--ease) infinite}
.on .ring.r2{animation-delay:.9s}
/* processing: whole orb swirls */
.busy .orb{animation-duration:1.6s}
.busy .orb i{animation-duration:calc(var(--d,7s) * .45)}
@keyframes ring{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
.voice .cap{font-size:15px;color:var(--muted);text-align:center;min-height:20px}
.on .cap{color:var(--fg)}
.compose{display:flex;gap:6px;align-items:flex-end;border-radius:26px;padding:5px;margin-top:6px}

.selbar{position:fixed;left:50%;bottom:calc(84px + var(--sab,env(safe-area-inset-bottom,0px)));z-index:35;transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;gap:8px;align-items:center;border-radius:999px;padding:6px 6px 6px 18px;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .45s var(--spring),opacity .25s}

// ================= LOCAL DATABASE (this device) =================
const LDB=(()=>{const KEY="pb-db-v1";const subs=new Map();
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch{return {};}};let store=load();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){note("Память браузера переполнена — сделай экспорт данных.");}};
  const coll=p=>store[p]||(store[p]={});
  const snap=p=>({docs:Object.entries(coll(p)).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))})),metadata:{fromCache:false}});
  const emit=p=>{for(const cb of subs.get(p)||[])setTimeout(()=>cb(snap(p)),0);};
  const ref=(p,id)=>({id,set:async d=>{coll(p)[id]=JSON.parse(JSON.stringify(d));save();emit(p);},update:async d=>{coll(p)[id]={...(coll(p)[id]||{}),...d};save();emit(p);},
    delete:async()=>{delete coll(p)[id];save();emit(p);},get:async()=>({id,exists:id in coll(p),data:()=>coll(p)[id]})});
  const collection=p=>({doc:id=>ref(p,id),add:async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await ref(p,id).set(d);return {id};},
    onSnapshot:(cb)=>{if(!subs.has(p))subs.set(p,new Set());subs.get(p).add(cb);setTimeout(()=>cb(snap(p)),0);return()=>subs.get(p).delete(cb);}});
  addEventListener("storage",e=>{if(e.key===KEY){store=load();for(const p of subs.keys())emit(p);}});
  return {collection,doc:path=>{const i=path.lastIndexOf("/");return ref(path.slice(0,i),path.slice(i+1));},
    dump:()=>JSON.parse(JSON.stringify(store)),replace:o=>{store=o;save();for(const p of subs.keys())emit(p);}};})();

const AI_PROV={gemini:{n:"Google Gemini"},openai:{n:"OpenAI (ChatGPT)",base:"https://api.openai.com/v1"},deepseek:{n:"DeepSeek",base:"https://api.deepseek.com/v1",model:"deepseek-chat"},

const aiGuess=k=>/^(AIza|AQ\.)/.test(k)?"gemini":/^sk-ant-/.test(k)?"anthropic":/^sk-or-/.test(k)?"openrouter":/^sk-/.test(k)?"openai":null;
const aiErr=(code,message)=>Object.assign(new Error(message||code),{code});
async function aiFetch(url,opt){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),60000);let r;
  try{r=await fetch(url,{...opt,signal:ac.signal});}catch(e){clearTimeout(t);throw aiErr(e.name==="AbortError"?"timeout":"network");}
  clearTimeout(t);let j=null;try{j=await r.json();}catch{}
  if(!r.ok){const m=j?.error?.message||j?.message||("HTTP "+r.status);throw aiErr(r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":r.status===404?"bad_model":"http",m);}
  return j;}
const anthH=k=>({"x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","content-type":"application/json"});
async function aiModel(c){if(c.model)return c.model;if(c.auto&&c.autoFor===c.prov+c.key.slice(-6))return c.auto;let id=null;
  if(c.prov==="gemini"){const j=await aiFetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":c.key}});
    const ms=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
      .filter(n=>/^gemini-\d/.test(n)&&/flash/.test(n)&&!/(image|tts|audio|live|thinking|exp|embedding|8b)/.test(n));
    const ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]);
    ms.sort((a,b)=>ver(b)-ver(a)||(/preview/.test(a)-/preview/.test(b))||(/lite/.test(a)-/lite/.test(b))||a.length-b.length);id=ms[0];}
  else if(c.prov==="anthropic"){const j=await aiFetch("https://api.anthropic.com/v1/models?limit=100",{headers:anthH(c.key)});const ms=(j.data||[]).map(m=>m.id);
    id=ms.find(x=>/haiku/.test(x))||ms.find(x=>/sonnet/.test(x))||ms[0];}
  else{const base=(c.base||AI_PROV[c.prov]?.base||"").replace(/\/$/,"");if(AI_PROV[c.prov]?.model)id=AI_PROV[c.prov].model;
    else{const j=await aiFetch(base+"/models",{headers:{Authorization:"Bearer "+c.key}});const ms=(j.data||[]).map(m=>m.id);
      id=ms.find(x=>/^gpt-[\d.]+-mini$/.test(x))||ms.find(x=>/^gpt-[\d.o]+(-mini)?$/.test(x))||ms.find(x=>/mini|flash|chat/.test(x))||ms[0];}}
  if(!id)throw aiErr("bad_model","Не нашёл подходящую модель — впиши её название вручную.");
  c.auto=id;c.autoFor=c.prov+c.key.slice(-6);aiSet(c);return id;}
async function toB64(blob){const img=await createImageBitmap(blob).catch(()=>null);
  if(!img){const b=await blob.arrayBuffer();let s="";const u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return {mime:blob.type||"image/jpeg",data:btoa(s)};}
  const k=Math.min(1,1600/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);return {mime:"image/jpeg",data:cv.toDataURL("image/jpeg",.85).split(",")[1]};}
function parseJSON(t){t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");try{return JSON.parse(t);}catch{}
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch{}}throw aiErr("invalid_json");}
async function aiJSON(prompt,opts={}){const c=aiCfg();if(!c.key)throw aiErr("no_key");const prov=c.prov||aiGuess(c.key)||"openai";c.prov=prov;
  const imgs=await Promise.all((opts.images||[]).map(toB64));const model=await aiModel(c);let text;
  if(prov==="gemini"){const j=await aiFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":c.key},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt},...imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}}))]}],generationConfig:{temperature:.2,responseMimeType:"application/json"}})});
    text=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");}
  else if(prov==="anthropic"){const j=await aiFetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:anthH(c.key),
      body:JSON.stringify({model,max_tokens:2048,messages:[{role:"user",content:[...imgs.map(i=>({type:"image",source:{type:"base64",media_type:i.mime,data:i.data}})),{type:"text",text:prompt}]}]})});
    text=(j.content||[]).map(b=>b.text||"").join("");}
  else{const base=(c.base||AI_PROV[prov]?.base||"").replace(/\/$/,"");if(!base)throw aiErr("http","Укажи адрес API в настройках ИИ.");
    const j=await aiFetch(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+c.key},
      body:JSON.stringify({model,temperature:.2,messages:[{role:"user",content:imgs.length?[{type:"text",text:prompt},...imgs.map(i=>({type:"image_url",image_url:{url:`data:${i.mime};base64,${i.data}`}}))]:prompt}]})});
    text=j.choices?.[0]?.message?.content;if(Array.isArray(text))text=text.map(x=>x.text||"").join("");}
  return parseJSON(text);}

function accBalance(id){const a=accById(id);let b=Number(a?.start)||0;for(const t of S.txs){

function overspends(ym){const sp=spentBy(ym);return CATS.expense.map(c=>c[0]).map(c=>({cat:c,lim:limitFor(ym,c),sp:sp[c]||0})).filter(x=>x.lim>0&&x.sp>x.lim);}

// smooth number tweening: any element with data-tw="key" data-v="number" counts from its last shown value
const TW=new Map();
const easeOut=p=>p===1?1:1-Math.pow(2,-10*p);
// gentle start, long soft landing
const easeSmooth=p=>{const q=1-Math.pow(1-p,2.2);return q*q*(3-2*q);};
function tweenAll(){document.querySelectorAll("[data-tw]").forEach(el=>{const key=el.dataset.tw,to=+el.dataset.v,sign=el.dataset.sign==="1";
  const f=v=>el.dataset.f==="pct0"?Math.round(v)+"%":el.dataset.f==="pct"?pct(v):fmt(v,sign);
  // no motion on app entry / first view: animate only when a known value actually changes after data has loaded
  if(!S.ready){el.textContent=f(to);return;}
  const known=TW.has(key),from=known?TW.get(key):to;TW.set(key,to);
  if(RM||!known||from===to||!isFinite(to)){el.textContent=f(to);return;}
  const slow=el.dataset.slow==="1";
  const t0=performance.now(),d=slow?Math.min(2600,1600+Math.log10(Math.abs(to-from)+1)*120):Math.min(1400,700+Math.log10(Math.abs(to-from)+1)*90);
  const ez=slow?easeSmooth:easeOut;let last="";
  const step=t=>{if(!el.isConnected)return;const p=Math.min((t-t0)/d,1);const txt=f(Math.round(from+(to-from)*ez(p)));if(txt!==last){el.textContent=txt;last=txt;}if(p===1)el.textContent=f(to);if(p<1)requestAnimationFrame(step);};
  el.textContent=f(from);requestAnimationFrame(step);});}
const tw=(key,v,sign,f,slow)=>`data-tw="${key}" data-v="${Math.round((+v||0)*100)/100}"${sign?' data-sign="1"':""}${f?` data-f="${f}"`:""}${slow?' data-slow="1"':""}`;

let nOpen=[];
function opNote({title,body,undo,ms=6500,quiet}){
  if(nOpen.length>=3)nOpen[0].close();
  const el=document.createElement("div");el.className="ban";el.setAttribute("role","status");
  el.innerHTML=`<img src="${LOGO}" alt=""><div class="bb"><div class="bh"><b>${esc(title)}</b><time>сейчас</time></div><div class="bt">${body}</div>${undo?`<button class="bu">Отменить</button>`:""}</div>`;
  $("notes").appendChild(el);if(!quiet&&navigator.vibrate)navigator.vibrate([8,40,8]);
  let gone=false,tm=ms?setTimeout(close,ms):0;
  function close(){if(gone)return;gone=true;clearTimeout(tm);nOpen=nOpen.filter(x=>x!==api);el.style.animation="";el.style.transition="";el.style.transform="";el.classList.add("out");setTimeout(()=>el.remove(),RM?0:380);}
  const api={close,el};nOpen.push(api);
  if(undo)el.querySelector(".bu").onclick=async e=>{e.stopPropagation();close();await undo();};
  el.onclick=()=>{close();if(S.view!=="ops")go("ops","enter");};
  // drag: follows the finger; downward pull is rubber-banded; release flings up or to the side
  let drag=null,moved=false;
  const pos=e=>e.touches?e.touches[0]:e;
  el.addEventListener("touchstart",e=>{const t=pos(e);drag={x0:t.clientX,y0:t.clientY,x:0,y:0,t:performance.now(),vx:0,vy:0,axis:null};moved=false;clearTimeout(tm);el.style.animation="none";el.style.transition="none";},{passive:true});
  el.addEventListener("touchmove",e=>{if(!drag)return;const t=pos(e),now=performance.now();let dx=t.clientX-drag.x0,dy=t.clientY-drag.y0;
    if(!drag.axis&&(Math.abs(dx)>6||Math.abs(dy)>6))drag.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(drag.axis==="x")dy=0;else dx=0;
    if(dy>0)dy=Math.pow(dy,.6);                       // resist pulling down
    const dt=Math.max(now-drag.t,1);drag.vx=(dx-drag.x)/dt;drag.vy=(dy-drag.y)/dt;drag.x=dx;drag.y=dy;drag.t=now;moved=moved||Math.abs(dx)+Math.abs(dy)>4;
    el.style.transform=`translate3d(${dx}px,${dy}px,0)`;el.style.opacity=drag.axis==="x"?String(1-Math.min(Math.abs(dx)/(innerWidth*.9),.7)):"";},{passive:true});
  el.addEventListener("touchend",()=>{if(!drag)return;const {x,y,vx,vy,axis}=drag;drag=null;
    const fling=axis==="x"?(Math.abs(x)>innerWidth*.28||Math.abs(vx)>.55):(y<-22||vy<-.45);
    if(fling&&!gone){gone=true;clearTimeout(tm);nOpen=nOpen.filter(q=>q!==api);
      const tx=axis==="x"?Math.sign(x||vx||1)*innerWidth*1.1:0,ty=axis==="x"?0:-(el.offsetHeight+40);
      const v=axis==="x"?Math.abs(vx):Math.abs(vy);const d=Math.max(180,Math.min(360,320-v*90));
      el.style.transition=`transform ${d}ms cubic-bezier(.2,.7,.3,1),opacity ${d}ms ease-out`;el.style.transform=`translate3d(${tx}px,${ty}px,0)`;el.style.opacity="0";
      setTimeout(()=>el.remove(),d+30);return;}
    el.style.transition="transform .5s cubic-bezier(.2,1.25,.35,1),opacity .3s";el.style.transform="";el.style.opacity="";if(ms)tm=setTimeout(close,3000);});
  el.addEventListener("click",e=>{if(moved){e.stopImmediatePropagation();moved=false;}},true);
  return api;
}

function opRange(){const per=S.opPer||"all";if(per==="all")return null;const a=dOf(S.opAnchor||iso(today));

  if(per==="week"){const st=new Date(a);st.setDate(a.getDate()-((a.getDay()+6)%7));const en=new Date(st);en.setDate(st.getDate()+6);return[iso(st),iso(en)];}

  if(per==="day"){const d=iso(a);return d===iso(today)?"Сегодня":d===iso(new Date(Date.now()-864e5))?"Вчера":`${a.getDate()} ${MGEN[a.getMonth()]}${yr(a)}`;}

    b.addEventListener("touchstart",e=>{if(S.selecting)return;const p=e.touches[0];x0=p.clientX;y0=p.clientY;dx=0;locked=null;drag=false;startOff=openRow===row?-80:0;if(openRow&&openRow!==row)closeRow();},{passive:true});
    b.addEventListener("touchmove",e=>{if(S.selecting)return;const p=e.touches[0];const mx=p.clientX-x0,my=p.clientY-y0;
      if(locked===null&&(Math.abs(mx)>8||Math.abs(my)>8))locked=Math.abs(mx)>Math.abs(my);
      if(!locked)return;drag=true;dx=Math.max(Math.min(startOff+mx,0),-220);b.classList.add("drag");row.classList.add("dragging");b.style.transform=`translateX(${dx}px)`;},{passive:true});

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||micBlocked){fallbackMic();return;}
  if(rec){try{rec.abort();}catch{}rec=null;}
  try{
    const r=SRI||(SRI=new SR());rec=r;heard="";
    r.lang="ru-RU";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
    r.onresult=e=>{if(rec!==r)return;let s="";for(const x of e.results)s+=x[0].transcript;heard=s;const ta=$("aiText");if(ta){ta.value=s;autosize();}};
    r.onerror=e=>{if(["not-allowed","service-not-allowed"].includes(e.error)){micBlocked=true;lsSet("voiceMode","kbd");rec=null;SRI=null;micUI();fallbackMic();}
      else if(e.error==="no-speech")capMsg("Ничего не услышал — нажми и попробуй ещё раз");
      else if(e.error==="audio-capture")capMsg("Микрофон занят — попробуй ещё раз");};
    r.onend=()=>{if(rec!==r)return;rec=null;clearTimeout(micT);micUI();const txt=heard.trim();heard="";
      if(txt){const ta=$("aiText");if(ta){ta.value="";autosize();}submitText(txt);}};
    r.start();micUI();if(navigator.vibrate)navigator.vibrate(10);
    clearTimeout(micT);micT=setTimeout(()=>{try{r.stop();}catch{}},25000);
  }catch{rec=null;SRI=null;micUI();capMsg("Не удалось включить микрофон — нажми ещё раз");}
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of[1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p;}

async function fetchPrice(a,cbr){const t=a.ticker.toUpperCase();
  if(a.kind==="moex"){const j=await (await fetch(`https://iss.moex.com/iss/engines/stock/markets/shares/securities/${encodeURIComponent(t)}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE,LCURRENTPRICE`)).json();
    const cols=j.marketdata.columns,rows=j.marketdata.data.map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]])));const r=rows.find(x=>x.BOARDID==="TQBR")||rows.find(x=>x.BOARDID==="TQTF")||rows.find(x=>x.LAST||x.LCURRENTPRICE||x.MARKETPRICE);
    const p=r&&(r.LAST||r.LCURRENTPRICE||r.MARKETPRICE);return p>0?{price:p,source:"Мосбиржа"}:null;}
  if(a.kind==="currency"){const v=cbr?.Valute?.[t];return v?{price:v.Value/v.Nominal,source:"ЦБ РФ"}:t==="RUB"?{price:1,source:"—"}:null;}
  if(a.kind==="crypto"){let id=CG_IDS[t];if(!id){const s=await (await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(t)}`)).json();id=(s.coins||[]).find(c=>c.symbol?.toUpperCase()===t)?.id;}
    if(!id)return null;const j=await (await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=rub`)).json();const p=j?.[id]?.rub;return p>0?{price:p,source:"CoinGecko"}:null;}
  return null;}

  let ok=0,miss=0;const at=new Date().toISOString();

function wireAISettings(){const c=aiCfg();const P=$("aiProv"),K=$("aiKey"),M=$("aiModel"),B=$("aiBase"),BL=$("aiBaseL"),ST=$("aiStat");
  P.value=c.prov||(c.key&&aiGuess(c.key))||"gemini";K.value=c.key||"";M.value=c.model||"";
  const sync=()=>{const pv=AI_PROV[P.value];const needBase=!["gemini","anthropic"].includes(P.value);BL.style.display=needBase?"":"none";BL.parentElement.style.gridTemplateColumns=needBase?"":"1fr";
    if(needBase&&!B.value)B.value=pv.base||"";if(P.value==="custom"&&B.value===AI_PROV.openai.base)B.value="";M.placeholder=c.auto&&c.prov===P.value?`авто: ${c.auto}`:"авто";};
  B.value=c.base||"";sync();
  if(c.key)ST.textContent=`Подключено: ${AI_PROV[c.prov||aiGuess(c.key)||"openai"].n}${c.model||c.auto?` · ${c.model||c.auto}`:""}. Ключ хранится только на этом телефоне.`;
  P.onchange=()=>{B.value="";sync();};
  K.oninput=()=>{const g=aiGuess(K.value.trim());if(g&&g!==P.value){P.value=g;B.value="";sync();}};
  $("aiDel").onclick=()=>{aiSet({});K.value="";M.value="";ST.textContent="Ключ удалён.";toast("Ключ удалён");};
  $("aiSave").onclick=async()=>{const key=K.value.trim();if(!key){ST.textContent="Вставь API-ключ.";return;}
    const nc={prov:P.value,key,model:M.value.trim(),base:["gemini","anthropic"].includes(P.value)?"":B.value.trim()};aiSet(nc);
    const btn=$("aiSave");btn.disabled=true;btn.innerHTML='<span class="spin"></span>Проверяю…';ST.style.color="";
    try{const r=await aiJSON('Ответь строго JSON: {"ok":true}');const cc=aiCfg();ST.style.color="var(--inc)";ST.textContent=`Работает ✓ ${AI_PROV[cc.prov].n} · ${cc.model||cc.auto}`;M.placeholder=`авто: ${cc.auto||""}`;}
    catch(e){ST.style.color="var(--exp)";ST.textContent=(SAMPLE_ERR[e?.code]||"Не получилось.")+(e?.message&&e.message!==e.code?" "+String(e.message).slice(0,160):"");}
    btn.disabled=false;btn.textContent="Сохранить";};}

function budgets(){
  const key=curKey(),spent=spentBy(key);const cats=CATS.expense.map(c=>c[0]);
  const lims=Object.fromEntries(cats.map(c=>[c,limitFor(key,c)]));const limTotal=cats.reduce((s,c)=>s+lims[c],0);
  const spentIn=cats.filter(c=>lims[c]).reduce((s,c)=>s+(spent[c]||0),0);
  const isCur=key===thisYm,editable=key>=thisYm;const left=new Date(S.ym[0],S.ym[1]+1,0).getDate()-today.getDate()+1;
  const colr=p=>p>1?"var(--exp)":p>.85?"var(--warn)":"var(--inc)";
  const hist=[];for(let k=1;k<=6;k++){const d=new Date(today.getFullYear(),today.getMonth()-k,1);const ym=ymk(d.getFullYear(),d.getMonth());const o=overspends(ym);if(o.length)hist.push([d,o]);}
  $("screen").innerHTML=`${navBack({home:"Обзор",stats:"Аналитика",more:"Счета"}[S.limFrom||"more"])}<div class="large">Лимиты</div>${monthBar()}
    <div class="card"><div class="lbl">Осталось по лимитам</div>
      ${limTotal?`<div class="bal" style="font-size:30px">${spentIn>limTotal?`<span class="exp">перерасход ${fmt(spentIn-limTotal)}</span>`:`<span ${tw("bLeft",limTotal-spentIn)}>${fmt(limTotal-spentIn)}</span>`}</div><div class="lbl">потрачено ${fmt(spentIn)} из ${fmt(limTotal)}${isCur&&limTotal>spentIn?` · можно ${fmt((limTotal-spentIn)/left)} в день`:""}</div>
      <div class="bar lg" style="margin-top:12px"><i style="width:${Math.min(spentIn/limTotal*100,100)}%;background:${colr(spentIn/limTotal)}"></i></div>`
      :`<div style="margin-top:4px">${editable?"Впиши лимит у нужных категорий ниже или попроси ИИ предложить лимиты в «Аналитике».":"В этом месяце лимитов не было."}</div>`}</div>
    <div class="hdr"><span>Категории</span></div>
    <div class="group">${CATS.expense.map(([c,ic],k)=>{const lim=lims[c],sp=spent[c]||0,p=lim?sp/lim:0;
      return `<div class="bud"><div class="r"><span class="ico" style="width:32px;height:32px;font-size:16px;border-radius:9px">${ic}</span><span class="nm">${esc(c)}${lim&&sp>lim?`<span class="badge">перерасход</span>`:""}${sp&&!lim?`<div class="lbl">${fmt(sp)}</div>`:""}</span>
        ${editable?`<input class="limit" id="lim${k}" data-c="${esc(c)}" inputmode="numeric" placeholder="Лимит" value="${lim||""}" aria-label="Лимит ${esc(c)}">`:`<span class="lbl">${lim?fmt(lim):"—"}</span>`}</div>
        ${lim?`<div class="bar lg" style="margin-top:9px"><i style="width:${Math.min(p*100,100)}%;background:${colr(p)};animation-delay:${k*40}ms"></i></div><div class="meta"><span>${fmt(sp)} из ${fmt(lim)}</span><span class="${sp>lim?"exp":""}">${sp>lim?"перерасход "+fmt(sp-lim):"осталось "+fmt(lim-sp)}</span></div>`:""}</div>`;}).join("")}</div>
    ${hist.length?`<div class="hdr"><span>История перерасходов</span></div><div class="group">${hist.map(([d,o])=>`<div class="rec"><span class="ico" style="width:32px;height:32px;font-size:15px;border-radius:9px">⚠️</span><span class="nm"><div>${MONTHS[d.getMonth()]} ${d.getFullYear()}</div><div>${o.map(x=>`${esc(x.cat)} ${fmt(x.sp-x.lim,true)}`).join(" · ")}</div></span></div>`).join("")}</div>`:""}`;

}

function goalStats(g){const saved=Math.max(accBalance(g.acc),0),target=+g.target||0,p=target?Math.min(saved/target,1):0;
  let perMonth=0,monthsLeft=null;if(g.date&&target>saved){const d=new Date(g.date+"T12:00:00");monthsLeft=Math.max((d.getFullYear()-today.getFullYear())*12+d.getMonth()-today.getMonth(),0);perMonth=(target-saved)/Math.max(monthsLeft,1);}
  return{saved,target,p,perMonth,monthsLeft,done:target>0&&saved>=target};}
function goalsScreen(){
  const G=S.set.goals;const tot=G.reduce((s,g)=>s+goalStats(g).saved,0),tgt=G.reduce((s,g)=>s+(+g.target||0),0);
  const back=S.goalFrom==="more"?"more":"home";
  $("screen").innerHTML=`${navBack(back==="more"?"Счета":"Обзор")}<div class="large">Цели</div>
    ${G.length?`<div class="card" style="margin-bottom:12px"><div class="lbl">Накоплено на цели</div><div class="bal tw" ${tw("gTot",tot)}>${fmt(tot)}</div><div class="lbl">из ${fmt(tgt)}</div>

        <div class="r"><span class="ring2"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" stroke="var(--fill)"/><circle class="p" cx="23" cy="23" r="19" stroke="${st.done?"var(--inc)":"var(--tint)"}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-st.p)}"/></svg>${esc(g.icon||"🎯")}</span>
          <span class="nm">${esc(g.name)}<small>${st.done?"Цель достигнута 🎉":g.date?`до ${new Date(g.date+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}`:"без срока"}</small></span>
          <span class="pct ${st.done?"inc":""}" ${tw("gp"+g.id,st.p*100,0,"pct0")}>${Math.round(st.p*100)}%</span></div>
        <div class="bar lg"><i style="width:${st.p*100}%;background:${st.done?"var(--inc)":"var(--tint)"}"></i></div>
        <div class="meta"><span><b style="color:var(--fg);font-weight:600" ${tw("gs"+g.id,st.saved)}>${fmt(st.saved)}</b> из ${fmt(st.target)}</span>
          <span>${st.done?"":st.perMonth?`≈ ${fmt(Math.ceil(st.perMonth))} в месяц`:`осталось ${fmt(st.target-st.saved)}`}</span></div>
        ${st.done?"":`<div class="r" style="justify-content:flex-end"><button class="add" data-gadd="${esc(g.id)}">＋ Пополнить</button></div>`}
      </div>`;}).join("")
      :`<div class="empty"><b>Пока нет целей</b>Создай цель — отпуск, машину, подушку — и откладывай на неё. Можно голосом: «отложил 5000 на отпуск».</div>`}</div>

  const G=S.goalEdit,isNew=!G.id;
  $("screen").innerHTML=`${navBack("Цели")}<div class="large">${isNew?"Новая цель":esc(G.name)}</div>
    <div class="card" style="display:grid;gap:12px">
      <div class="chiprow wrapc">${GOAL_ICONS.map(ic=>`<button type="button" data-gi="${ic}" aria-pressed="${ic===G.icon}" style="font-size:20px">${ic}</button>`).join("")}</div>
      <label class="lab"><span>Название</span><input class="field" id="gName" value="${esc(G.name)}" placeholder="Например, Отпуск" autocomplete="off"></label>

      ${isNew?`<label class="lab"><span>Уже отложено, ₽</span><input class="field" id="gStart" inputmode="decimal" value="${esc(G.start||"")}" placeholder="0"></label>`:""}
      <div class="lbl">У цели свой счёт. Пополняй переводом с карты или скажи: «отложил 5000 на ${esc(G.name||"отпуск").toLowerCase()}».</div>

    else if(T.amt.replace(/\D/g,"").length<9&&!/,\d\d$/.test(T.amt))T.amt=(T.amt==="0"?"":T.amt)+k;upd();});
  let armed=false;
  if($("trDel"))$("trDel").onclick=async()=>{if(!armed){armed=true;$("trDel").textContent="Точно удалить?";return;}
    const data={...T.edit};const id=data.id;delete data.id;try{await S.col.doc(id).delete();go(back,"pop");toast("Перевод удалён",async()=>{try{await S.col.doc(id).set(data);}catch{}});}catch{$("trErr").textContent="Не удалось удалить.";}};
  $("trGo").onclick=async()=>{keep();const a=num(T.amt);if(!(a>0)||T.from===T.to)return;
    if(!S.col){$("trErr").textContent="Перевод сохраняется, только когда ты вошёл в свой аккаунт.";return;}
    const tx={kind:"tx",p:S.pid,type:"transfer",amount:a,account:T.from,to:T.to,cat:"",note:T.note.trim(),date:T.date||iso(new Date()),created:T.edit?.created||Date.now()};
    $("trGo").disabled=true;$("trGo").innerHTML='<span class="spin"></span>Перевожу…';
    try{if(T.edit)await S.col.doc(T.edit.id).set(tx);else await S.col.add(tx);S.trDone={amount:a,from:T.from,to:T.to,edit:!!T.edit};render("enter");opNote({title:T.edit?"Перевод изменён":"Перевод выполнен",body:opBody([tx])});}
    catch{$("trGo").disabled=false;$("trGo").textContent=`Перевести ${fmt(a)}`;$("trErr").textContent="Не удалось выполнить перевод. Попробуй ещё раз.";}};
}

// ================= recurring auto-log =================
let recRunning=false;
async function runRecurring(){
  if(!S.col||recRunning)return;recRunning=true;let changed=false;
  for(const r of S.set.recurring){if(r.last===thisYm||today.getDate()<r.day)continue;
    try{await addTx({type:r.type,amount:r.amount,cat:r.cat,account:accById(r.account)?r.account:S.set.accounts[0].id,note:r.name+" · авто",date:`${thisYm}-${pad2(r.day)}`});r.last=thisYm;changed=true;}catch{}}
  if(changed)saveSet();recRunning=false;
}

// ================= boot =================
// ---------- keep portrait ----------
const LAND=matchMedia("(orientation:landscape) and (max-height:540px) and (pointer:coarse)");
function fixOrient(){const land=LAND.matches;let a=screen.orientation&&typeof screen.orientation.angle==="number"?screen.orientation.angle:(typeof window.orientation==="number"?window.orientation:90);
  a=((a%360)+360)%360;const c=document.documentElement.classList;c.toggle("rotL",land&&a!==270);c.toggle("rotR",land&&a===270);requestAnimationFrame(moveTab);}
try{screen.orientation?.lock?.("portrait").catch(()=>{});}catch{}
fixOrient();LAND.addEventListener?.("change",fixOrient);addEventListener("orientationchange",()=>setTimeout(fixOrient,60));screen.orientation?.addEventListener?.("change",fixOrient);
render();
addEventListener("resize",()=>{fixOrient();});
(async()=>{
  const db=await claude.use("db"),user=await claude.use("user");const uid=user?await user.id():null;
  if(!db||!uid){S.ready=true;render();note("Записи сохраняются, когда ты вошёл в свой аккаунт.");return;}
  S.db=db;S.col=db.collection("data/users/"+uid);
  db.collection("prices").onSnapshot(snap=>{const p={};for(const d of snap.docs){const v=d.data();if(v&&v.price>0)p[d.id]=v;}S.prices=p;
    const sig=JSON.stringify(p);if(sig===S.priceSig)return;S.priceSig=sig;
    if((S.view==="invest"||S.view==="assetEdit"||(S.view==="home"&&S.set.assets.length))&&!busyTyping())scheduleRender();},()=>{});
  let first=true;
  S.col.onSnapshot(snap=>{
    const txs=[],sets={};let prof=null;
    for(const d of snap.docs){const v=d.data();if(!v)continue;
      if(d.id==="profiles")prof=v;else if(d.id==="settings")sets.main=v;else if(d.id.startsWith("settings-"))sets[d.id.slice(9)]=v;
      else if(v.date&&(v.amount>0||v.type==="adjust"))txs.push({id:d.id,...v});}
    const sig=JSON.stringify([txs,sets,prof]);const same=sig===S.dataSig;S.dataSig=sig;
    if(same&&!first)return;
    S.allTx=txs;S.allSet=sets;if(txs.length&&/Импорт данных/.test($("notice").textContent))note("");
    if(prof&&Array.isArray(prof.list)&&prof.list.length){S.profiles=prof.list;if(first&&prof.current&&prof.list.some(p=>p.id===prof.current))S.pid=prof.current;}
    if(!S.profiles.some(p=>p.id===S.pid))S.pid=S.profiles[0].id;
    applyProfile();S.ready=true;if(!first)checkGoals();
    if(S.view==="home"){if(!busyTyping()&&!rec)scheduleRender();}
    else if(S.view==="ops"){if(!busyTyping()&&!openRow&&!S.selecting)render();else if(!openRow)refreshList();}
    else if(!["add","accEdit","assetEdit","profiles","transfer"].includes(S.view)&&!busyTyping())scheduleRender();
    if(first&&!snap.metadata.fromCache){
      if(!txs.length&&!sets.main)note("Чтобы перенести прежние записи: Счета → Данные → Импорт данных.");
      setTimeout(()=>{let last=0;try{last=Date.parse(localStorage.getItem("pb-prices-at")||"")||0;}catch{}if(Date.now()-last>3*3600e3)refreshPrices(true);},1500);
      first=false;if(!sets[S.pid])saveSet();else writeWatch();runRecurring();checkGoals();}
  },()=>{S.ready=true;render();note("Не удалось загрузить записи. Обнови страницу.");});
})();
document.addEventListener("change",e=>{if(e.target.closest(".sw")&&navigator.vibrate)navigator.vibrate(6);});
function busyTyping(){const ae=document.activeElement;return ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT");}
