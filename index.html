<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Карманный бюджет</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{color-scheme:dark}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: iOS-style app — large titles, inset grouped cards, floating Liquid Glass tab bar; screens push/pop with motion */
:root{
  --bg:#000000; --surface:#111113; --surface2:#1C1C1F; --fg:#FFFFFF; --muted:#8C8C92; --line:rgba(255,255,255,.08); --soft:#1C1C1F; --fill:rgba(255,255,255,.08); --track:rgba(120,120,128,.36);
  --tint:#FFFFFF; --on-tint:#000000; --link:#FFFFFF; --inc:#21C37A; --exp:#F04A5D; --warn:#F5A524; --exp-soft:rgba(240,74,93,.14); --inc-soft:rgba(33,195,122,.14);
  --glass:rgba(30,30,33,.62); --glass-rim:rgba(0,0,0,.6); --glass-hi:rgba(255,255,255,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.45,.55,1); --ease:cubic-bezier(.32,.72,0,1); color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF; --surface:#F4F4F6; --surface2:#EAEAEE; --fg:#000000; --muted:#7A7A80; --line:rgba(0,0,0,.07); --soft:#EAEAEE; --fill:rgba(0,0,0,.05); --track:rgba(120,120,128,.18);
  --tint:#000000; --on-tint:#FFFFFF; --link:#000000; --inc:#12A866; --exp:#E23A4E; --warn:#E0901A; --exp-soft:rgba(226,58,78,.10); --inc-soft:rgba(18,168,102,.10);
  --glass:rgba(255,255,255,.72); --glass-rim:rgba(0,0,0,.12); --glass-hi:rgba(255,255,255,.95); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F4F4F6; --surface2:#EAEAEE; --fg:#000000; --muted:#7A7A80; --line:rgba(0,0,0,.07); --soft:#EAEAEE; --fill:rgba(0,0,0,.05); --track:rgba(120,120,128,.18);
  --tint:#000000; --on-tint:#FFFFFF; --link:#000000; --inc:#12A866; --exp:#E23A4E; --warn:#E0901A; --exp-soft:rgba(226,58,78,.10); --inc-soft:rgba(18,168,102,.10);
  --glass:rgba(255,255,255,.72); --glass-rim:rgba(0,0,0,.12); --glass-hi:rgba(255,255,255,.95); color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em;min-height:100%;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(120px + env(safe-area-inset-bottom,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-hi),0 0 0 .5px var(--glass-rim),0 10px 30px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:2px}
.nav .sp{flex:1}
.back{border:0;background:none;color:var(--fg);font-weight:500;font-size:17px;display:flex;align-items:center;gap:2px;padding:6px 6px 6px 0}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.gbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--fg)}
.gbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 2px 12px;line-height:1.1}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px 12px}
.ptitle .large{margin:0}
.prof{border:0;border-radius:999px;padding:7px 12px 7px 9px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof span:last-child{color:var(--muted);font-size:12px}
.card{background:var(--surface);border-radius:20px;padding:16px}
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.lbl{font-size:13px;color:var(--muted)}
.hdr{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:22px 16px 7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr button{border:0;background:none;color:var(--link);font-weight:600;font-size:15px;text-transform:none;letter-spacing:-.01em;padding:0}
.inc{color:var(--inc)} .exp{color:var(--exp)}
.bal{font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:2px}
.mline{font-size:15px;color:var(--muted);margin-top:6px}
.accs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -16px -2px;padding:0 16px 2px}
.acc{flex:none;border:0;background:var(--fill);border-radius:14px;padding:8px 12px;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.acc b{font-weight:600}
.acc.off{opacity:.55}
.alert{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--exp-soft);color:var(--exp);border-radius:16px;padding:11px 14px;margin-top:10px;text-align:left;font-size:15px}
.alert b{font-weight:600}
/* voice */
.voice{display:grid;justify-items:center;gap:10px;padding:22px 0 8px}
.micw{position:relative;width:88px;height:88px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--tint);opacity:0}
.mic{position:relative;width:88px;height:88px;border-radius:50%;border:0;color:var(--on-tint);display:grid;place-items:center;background:var(--tint);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.35),0 0 0 6px var(--fill);transition:transform .45s var(--spring),background .3s,color .3s}
.mic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic:active{transform:scale(.9)}
.on .mic{background:var(--exp);color:#fff}
.on .ring{background:var(--exp);animation:ring 1.6s var(--ease) infinite}
.on .ring.r2{animation-delay:.8s}
@keyframes ring{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
.voice .cap{font-size:15px;color:var(--muted);text-align:center;min-height:20px}
.on .cap{color:var(--exp)}
.compose{display:flex;gap:6px;align-items:flex-end;border-radius:26px;padding:5px;margin-top:6px}
.compose textarea{flex:1;min-width:0;border:0;background:none;resize:none;padding:10px 8px;min-height:42px;max-height:140px;font-size:17px;line-height:1.3;outline:none}
.rb{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:none;color:var(--muted);transition:transform .3s var(--spring),opacity .2s}
.rb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.go{background:var(--tint);color:var(--on-tint)}
.rb:active{transform:scale(.88)}
.rb:disabled{opacity:.4}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.quick button{border:0;background:var(--surface);border-radius:18px;padding:13px;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
.quick button:active{transform:scale(.95)}
.quick i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px;line-height:1}
.tip{border-radius:20px;padding:12px 14px;font-size:14.5px;margin-top:10px}
.reply{background:var(--surface);border-radius:22px;padding:13px 15px;font-size:15px;margin-top:10px;transform-origin:top center}
.reply .q{color:var(--muted);font-size:14px;margin-bottom:5px}
.reply ul{margin:7px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.link{border:0;background:none;color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:15px}
/* transactions */
.search{width:100%;border:0;background:var(--fill);border-radius:12px;padding:9px 12px;font-size:17px;margin-bottom:10px;outline:none}
.day{font-size:13px;color:var(--muted);margin:16px 16px 6px;text-transform:uppercase;letter-spacing:.02em}
.row{position:relative;overflow:hidden;transition:height .32s var(--ease),opacity .25s;background:var(--surface)}
.row+.row::before{content:"";position:absolute;left:64px;right:0;top:0;height:.5px;background:var(--line);z-index:2}
.act{position:absolute;right:0;top:0;bottom:0;width:80px;display:grid;place-items:center}
.trash{width:46px;height:46px;border-radius:50%;border:0;background:var(--exp);color:#fff;display:grid;place-items:center;transform:scale(.4);opacity:0;transition:transform .35s var(--spring),opacity .2s}
.trash svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.open .trash,.row.dragging .trash{transform:scale(1);opacity:1}
.tx{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;border:0;background:var(--surface);text-align:left;touch-action:pan-y;transition:transform .4s var(--spring)}
.tx.drag{transition:none}
.chk{width:24px;height:24px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.6px var(--muted);display:grid;place-items:center;color:#fff;transition:background .2s,box-shadow .2s;margin-left:-2px}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.sel .chk{background:var(--inc);box-shadow:none}
.row.sel .chk svg{opacity:1}
.row.sel .tx{background:var(--surface2)}
.ico{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:18px;background:var(--fill)}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:500;font-size:16px}
.tx .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.empty{background:var(--surface);border-radius:22px;padding:22px 18px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-weight:600}
.more{display:block;width:100%;border:0;background:none;color:var(--tint);padding:14px;font-size:16px}
.selbar{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;gap:8px;align-items:center;border-radius:999px;padding:6px 6px 6px 18px;font-size:15px;font-weight:500;white-space:nowrap;transition:transform .45s var(--spring),opacity .25s}
.selbar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.selbar button{border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.selbar .d{background:var(--exp);color:#fff}
.selbar .c{background:var(--fill)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs{pointer-events:auto;display:flex;gap:0;padding:5px;border-radius:999px;position:relative;max-width:100%}
.tabs button{position:relative;z-index:1;border:0;background:none;border-radius:999px;padding:7px 10px 6px;display:grid;justify-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:70px;transition:color .25s}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--fg)}
.pill{position:absolute;top:5px;bottom:5px;border-radius:999px;background:var(--fill);transition:left .45s var(--spring),width .45s var(--spring)}
/* stats */
.mswitch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mswitch b{flex:1;font-size:17px;font-weight:600;text-align:center}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 10px;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.donut{display:grid;justify-items:center;padding:4px 0 8px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;background:none;width:100%;text-align:left}
.crow+.crow{border-top:.5px solid var(--line)}
.crow .ico{width:34px;height:34px;font-size:16px;border-radius:10px}
.crow .nm{flex:1;min-width:0;font-weight:500}
.crow .lim{font-size:12.5px;color:var(--muted);font-weight:400}
.badge{display:inline-block;font-size:11.5px;font-weight:600;color:#fff;background:var(--exp);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.bar{height:5px;border-radius:3px;background:var(--fill);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.pc{font-size:12.5px;color:var(--muted);text-align:right}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart rect{transform-box:fill-box;transform-origin:bottom;animation:rise .8s var(--spring) both}
@keyframes rise{from{transform:scaleY(0)}}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.keys i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .card{padding:13px 15px}
.tiles b{display:block;font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.ai-card{background:linear-gradient(135deg,var(--inc-soft),var(--surface) 55%);border-radius:24px;padding:16px}
.ai-card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.ai-card h3 i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--inc);color:#fff;display:grid;place-items:center;font-size:14px}
.advice{display:grid;gap:10px;margin-top:12px}
.adv{display:flex;gap:10px;align-items:flex-start}
.adv .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.adv b{display:block;font-weight:600}
.adv span{font-size:14.5px;color:var(--muted)}
/* menus */
.menu button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 16px;text-align:left;width:100%;position:relative}
.menu button+button::before,.menu .mrow+.mrow::before{content:"";position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--line)}
.menu .ico{width:32px;height:32px;border-radius:9px;font-size:16px}
.menu .nm{flex:1;min-width:0}
.menu .nm small{display:block;color:var(--muted);font-size:13px}
.menu .sub{color:var(--muted);font-size:15px;white-space:nowrap}
.chev{color:var(--muted);opacity:.6;font-size:20px;line-height:1}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.check{color:var(--inc);font-size:18px;font-weight:700}
/* switch — iOS style: knob stretches while pressed, springs on release */
.sw{position:relative;width:51px;height:31px;flex:none;display:block;-webkit-tap-highlight-color:transparent}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .32s cubic-bezier(.4,0,.2,1)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);transition:transform .5s var(--spring),width .28s var(--ease)}
.sw input:checked+span{background:var(--inc)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw:active span::after{width:34px}
.sw:active input:checked+span::after{transform:translateX(13px)}
.sw input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}
/* budgets */
.bud{padding:12px 16px;position:relative}
.bud+.bud::before{content:"";position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--line)}
.bud .r{display:flex;align-items:center;gap:12px}
.bud .r .nm{flex:1;font-weight:500}
.bud .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px;padding-left:44px}
.bud .bar{margin-left:44px}
.limit{width:96px;border:0;background:var(--fill);border-radius:9px;padding:7px 10px;text-align:right;font-size:16px}
.bar.lg{height:8px;border-radius:4px}
.rec{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.rec+.rec::before{content:"";position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--line)}
.rec .nm{flex:1;min-width:0}
.rec .nm div:last-child{font-size:13.5px;color:var(--muted)}
.x{border:0;background:none;color:var(--exp);font-size:15px;padding:4px 2px}
/* forms */
.amount{font-size:52px;font-weight:700;letter-spacing:-.04em;text-align:center;padding:12px 0 4px;overflow-wrap:anywhere;transition:color .25s}
.amount small{font-size:28px;color:var(--muted);font-weight:600}
.amount .bump{display:inline-block;animation:bump .25s var(--spring)}
@keyframes bump{from{transform:scale(1.12)}}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow.wrapc{flex-wrap:wrap;overflow:visible}
.chiprow button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;transition:background .2s,color .2s,transform .3s var(--spring)}
.card .chiprow button{background:var(--fill)}
.chiprow button:active{transform:scale(.94)}
.chiprow button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{border:0;background:var(--surface);border-radius:18px;padding:11px 3px 9px;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted);min-width:0;overflow:hidden;transition:transform .35s var(--spring),box-shadow .2s,color .2s}
.cats button span{font-size:24px;transition:transform .35s var(--spring)}
.cats button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg);color:var(--fg)}
.cats button[aria-pressed="true"] span{transform:scale(1.15)}
.cats button:active{transform:scale(.92)}
.fl{font-size:13px;color:var(--muted);margin:16px 16px 7px;text-transform:uppercase;letter-spacing:.02em}
.field{width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:17px;min-width:0;outline:none}
.card .field{background:var(--fill)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.field{appearance:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{border:0;background:var(--surface);border-radius:18px;padding:12px 0;font-size:26px;font-weight:400;transition:transform .25s var(--spring),background .15s}
.pad button:active{transform:scale(.92);background:var(--soft)}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:999px;padding:15px;font-weight:600;font-size:17px;transition:transform .3s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--tint);color:var(--on-tint)}

.acsel .mid{flex:1;min-width:0}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--r,0deg));width:42px;height:42px;border-radius:50%;border:4px solid var(--bg);background:var(--surface2);color:var(--fg);display:grid;place-items:center;transition:transform .55s var(--spring);z-index:2}
.picker{margin-top:6px}
.picker .group{animation:popup .35s var(--spring) both}
.avail{text-align:center;font-size:14px;color:var(--muted);min-height:20px}

.qa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

@keyframes draw{to{stroke-dashoffset:0}}
.done .big{font-size:40px;font-weight:700;letter-spacing:-.03em;animation:popup .5s .3s var(--spring) both}
.done .route{color:var(--muted);font-size:16px;animation:popup .5s .4s var(--spring) both}

  border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:14px;align-items:center;font-size:15px;font-weight:500;transition:transform .45s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:var(--tint);color:var(--on-tint);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;flex:none}
/* motion */
.enter>*{animation:rise-in .5s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.push>*{animation:push-in .48s var(--ease) both;animation-delay:calc(var(--i,0)*14ms)}
.pop>*{animation:pop-in .48s var(--ease) both;animation-delay:calc(var(--i,0)*14ms)}
@keyframes rise-in{from{opacity:0;transform:translateY(12px)}}
@keyframes push-in{from{opacity:0;transform:translateX(28%)}}
@keyframes pop-in{from{opacity:0;transform:translateX(-18%)}}
.pop-up{animation:popup .45s var(--spring) both}

.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
// ===== Standalone runtime: local storage + OpenRouter + public price sources =====
window.STANDALONE = true;
(function(){
  const LS = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } }
  };
  const PREFIX = "kb:";
  const cache = {};
  const subs = {};
  const load = p => (cache[p] ||= LS.get(PREFIX + p, {}));
  const persist = p => { if(!LS.set(PREFIX + p, cache[p])) throw {code:"quota_exceeded", message:"Память телефона заполнена"}; };
  const snap = p => ({ docs: Object.entries(load(p)).map(([id, v]) => ({ id, exists:true, data:() => v, metadata:{fromCache:false, hasPendingWrites:false} })), metadata:{fromCache:false, hasPendingWrites:false} });
  const emit = p => setTimeout(() => (subs[p] || []).forEach(f => { try{ f(snap(p)); }catch(e){ console.error(e); } }), 0);
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const docRef = (p, id) => ({
    id, path: p + "/" + id,
    async get(){ const v = load(p)[id]; return { id, exists: !!v, data: () => v, metadata:{fromCache:false} }; },
    async set(v){ load(p)[id] = JSON.parse(JSON.stringify(v)); persist(p); emit(p); },
    async update(v){ const c = load(p); if(!c[id]) throw {code:"invalid_argument"}; c[id] = {...c[id], ...v}; persist(p); emit(p); },
    async delete(){ delete load(p)[id]; persist(p); emit(p); }
  });
  const collRef = p => ({
    path: p,
    doc: id => docRef(p, id || rid()),
    async add(v){ const id = rid(); await docRef(p, id).set(v); return docRef(p, id); },
    onSnapshot(next){ (subs[p] ||= []).push(next); setTimeout(() => next(snap(p)), 0); return () => { subs[p] = (subs[p] || []).filter(f => f !== next); }; }
  });
  const db = {
    collection: collRef,
    doc(path){ const i = path.lastIndexOf("/"); return docRef(path.slice(0, i), path.slice(i + 1)); }
  };
  window.LOCALDB = { db, LS, PREFIX,
    exportAll(){ const out = {}; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.startsWith(PREFIX)) out[k.slice(PREFIX.length)] = LS.get(k, {}); } return out; },
    importAll(obj){ for(const [p, docs] of Object.entries(obj || {})){ const c = load(p); Object.assign(c, docs); persist(p); emit(p); } }
  };

  // ---- AI via OpenRouter ----
  const AI = {
    key(){ return LS.get("ai:key", ""); },
    model(){ return LS.get("ai:model", "") || "openrouter/free"; },
    modelSmart(){ return LS.get("ai:modelSmart", "") || AI.model(); }
  };
  window.AICONF = AI;
  const toDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
  async function shrink(file){
    try{
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.85);
    }catch{ return toDataURL(file); }
  }
  async function call(input, opts = {}){
    const key = AI.key();
    if(!key) throw {code:"no_key", message:"Нет ключа"};
    const prompt = typeof input === "string" ? input : input.map(m => m.content).join("\n\n");
    const imgs = opts.images ? (Array.isArray(opts.images) ? opts.images : [opts.images]) : [];
    let content = prompt;
    if(imgs.length){ content = [{type:"text", text:prompt}]; for(const f of imgs) content.push({type:"image_url", image_url:{url: await shrink(f)}}); }
    const model = opts.modelTier === "quick" ? AI.model() : AI.modelSmart();
    let r;
    try{
      r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method:"POST", signal: opts.signal,
        headers:{ "Authorization":"Bearer " + key, "Content-Type":"application/json", "X-Title":"Karmannyi budzhet" },
        body: JSON.stringify({ model, temperature: 0.2, messages:[{role:"user", content}] })
      });
    }catch(e){ throw {code: e && e.name === "AbortError" ? "cancelled" : "network", message:String(e)}; }
    let j = null; try{ j = await r.json(); }catch{}
    if(!r.ok){
      const code = r.status === 401 ? "bad_key" : r.status === 402 ? "no_credits" : r.status === 429 ? "rate_limited" : r.status === 403 ? "blocked" : "upstream_error";
      throw {code, message: j?.error?.message || ("HTTP " + r.status)};
    }
    const text = j?.choices?.[0]?.message?.content;
    if(!text || !String(text).trim()) throw {code:"empty_completion", message:"Пустой ответ"};
    return { text: String(text), truncated: j?.choices?.[0]?.finish_reason === "length", model: j?.model };
  }
  function parseJSON(t){
    const s = t.replace(/^[\s\S]*?```(?:json)?\s*([\s\S]*?)```[\s\S]*$/i, "$1").trim();
    try{ return JSON.parse(s); }catch{}
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b + 1)); }catch{} }
    throw {code:"invalid_json", message:"Не JSON", text:t};
  }
  const sample = async (input, opts) => call(input, opts);
  sample.json = async (input, opts) => {
    const add = "\n\nВажно: ответь ТОЛЬКО валидным JSON-объектом, без пояснений и без markdown.";
    const inp = typeof input === "string" ? input + add : input;
    const r = await call(inp, opts);
    return parseJSON(r.text);
  };
  sample.limits = async () => ({ maxPromptBytes: 262144, images: {maxCount: 1} });

  window.claude = {
    async use(name){
      if(name === "db") return db;
      if(name === "user") return { id: async () => "local", isOwner: () => true, canEdit: () => true, can: () => true };
      if(name === "sample") return sample;
      return null;
    }
  };

  // ---- Prices from public sources (called by the app) ----
  async function j(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
  let cbr = null;
  async function cbrRates(){ if(!cbr) cbr = await j("https://www.cbr-xml-daily.ru/daily_json.js"); return cbr.Valute || {}; }
  const geckoIds = LS.get("px:gecko", {});
  async function priceFor(a){
    const t = String(a.ticker || "").toUpperCase();
    if(a.kind === "moex"){
      for(const market of ["shares", "bonds"]){
        try{
          const d = await j(`https://iss.moex.com/iss/engines/stock/markets/${market}/securities/${encodeURIComponent(t)}.json?iss.meta=off&iss.only=marketdata,securities&marketdata.columns=SECID,BOARDID,LAST,MARKETPRICE,LCURRENTPRICE&securities.columns=SECID,BOARDID,PREVPRICE,FACEVALUE`);
          const md = d.marketdata?.data || [], sec = d.securities?.data || [];
          const pref = ["TQBR","TQTF","TQCB","TQOB","TQIR"];
          const row = md.sort((x, y) => (pref.indexOf(x[1]) + 99 * (pref.indexOf(x[1]) < 0)) - (pref.indexOf(y[1]) + 99 * (pref.indexOf(y[1]) < 0)))[0];
          let p = row ? (row[2] || row[4] || row[3]) : null;
          const srow = sec.find(s => row && s[1] === row[1]) || sec[0];
          if(!p && srow) p = srow[2];
          if(p && market === "bonds" && srow && srow[3]) p = p / 100 * srow[3];
          if(p) return {price: p, source: "Мосбиржа"};
        }catch{}
      }
      return null;
    }
    if(a.kind === "currency"){ const v = (await cbrRates())[t]; return v ? {price: v.Value / v.Nominal, source: "ЦБ РФ"} : null; }
    if(a.kind === "crypto"){
      let id = geckoIds[t];
      if(!id){ const s = await j("https://api.coingecko.com/api/v3/search?query=" + encodeURIComponent(t)); id = (s.coins || []).find(c => String(c.symbol).toUpperCase() === t)?.id; if(id){ geckoIds[t] = id; LS.set("px:gecko", geckoIds); } }
      if(!id) return null;
      const d = await j(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=rub`);
      return d[id]?.rub ? {price: d[id].rub, source: "CoinGecko"} : null;
    }
    return null;
  }
  window.fetchPricesLocal = async function(assets){
    const out = {}; let ok = 0, fail = 0;
    for(const a of assets){
      try{ const p = await priceFor(a); if(p){ out[a.id] = {...p, currency:"RUB", at:new Date().toISOString()}; ok++; } else fail++; }
      catch{ fail++; }
    }
    for(const [id, v] of Object.entries(out)) await db.doc("prices/" + id).set(v);
    return {ok, fail};
  };
})();

</script>

function invTotals(){let v=0,c=0;for(const a of S.set.assets){v+=a.qty*assetPrice(a);c+=a.qty*a.buy;}return{value:v,cost:c,pl:v-c,plp:c?(v-c)/c*100:0};}
function capital(){const accs=S.set.accounts.filter(a=>!a.exclude).reduce((s,a)=>s+accBalance(a.id),0);const inv=S.set.invInclude?invTotals().value:0;
  const reserved=S.set.accounts.filter(a=>a.exclude).reduce((s,a)=>s+accBalance(a.id),0);return{total:accs+inv,accs,inv,reserved};}
function limitFor(ym,cat){const keys=Object.keys(S.set.bh||{}).filter(k=>k<=ym).sort();for(let i=keys.length-1;i>=0;i--){const h=S.set.bh[keys[i]];if(h&&cat in h)return +h[cat]||0;if(h)return 0;}return ym>=thisYm?(+S.set.budgets[cat]||0):0;}
function spentBy(ym){const o={};for(const t of S.txs)if(t.type==="expense"&&t.date.startsWith(ym))o[t.cat]=(o[t.cat]||0)+t.amount;return o;}
function overspends(ym){const sp=spentBy(ym);return CATS.expense.map(c=>c[0]).map(c=>({cat:c,lim:limitFor(ym,c),sp:sp[c]||0})).filter(x=>x.lim>0&&x.sp>x.lim);}

let setChain=Promise.resolve();
function saveSet(){if(!S.col)return;const body=clone(S.set);const ref=S.col.doc(setDocId(S.pid));setChain=setChain.then(()=>ref.set(body)).catch(()=>note("Не удалось сохранить настройки."));writeWatch();}

function saveProfiles(){if(!S.col)return;const body={list:clone(S.profiles),current:S.pid};const ref=S.col.doc("profiles");profChain=profChain.then(()=>ref.set(body)).catch(()=>note("Не удалось сохранить профили."));}

let lastWatch="";
function writeWatch(){if(!S.db)return;const m={};for(const [pid,set] of Object.entries({...S.allSet,[S.pid]:S.set}))for(const a of (set.assets||[]))m[a.id]={id:a.id,ticker:a.ticker,kind:a.kind,name:a.name||""};
  const items=Object.values(m).sort((a,b)=>a.id.localeCompare(b.id));const j=JSON.stringify(items);if(j===lastWatch)return;lastWatch=j;
  S.db.doc("meta/watch").set({items}).catch(()=>{lastWatch="";});}

let toastT;
function toast(text,undo){$("toastText").textContent=text;const b=$("toastBtn");b.hidden=!undo;b.onclick=async()=>{hideToast();if(undo)await undo();};
  $("toast").classList.add("show");clearTimeout(toastT);toastT=setTimeout(hideToast,5000);}

function countUp(el,to){const from=S.shownBal;S.shownBal=to;if(RM||from===to){el.textContent=fmt(to);return;}
  const t0=performance.now(),d=700;const step=t=>{const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

function refreshList(){if($("txList")){$("txList").innerHTML=listHtml(filtered());wireList();}}
function filtered(){const q=(S.search||"").trim().toLowerCase();let it=sorted();
  if(q)it=it.filter(x=>[x.cat,x.note,accById(x.account)?.name,String(x.amount)].join(" ").toLowerCase().includes(q));return it;}
function listHtml(items){
  const q=(S.search||"").trim();
  if(!items.length)return `<div class="empty"><b>${q?"Ничего не нашлось":S.ready?"Пока пусто":"Загружаю…"}</b>${q?"":"Нажми на микрофон и скажи, что потратил."}</div>`;
  const lim=q||S.showAll||S.selecting?300:12;
  return txList(items.slice(0,lim))+(items.length>lim?`<button class="more" id="showAll">Показать все</button>`:"");
}
function wireList(){wireTx();if($("showAll"))$("showAll").onclick=()=>{S.showAll=true;refreshList();};}
function txList(items){
  const g={};for(const t of items)(g[t.date] ||= []).push(t);
  return Object.entries(g).map(([d,arr])=>{const dd=new Date(d+"T12:00:00");
    const lab=d===iso(today)?"Сегодня":d===iso(new Date(Date.now()-864e5))?"Вчера":`${dd.getDate()} ${MGEN[dd.getMonth()]}${dd.getFullYear()!==today.getFullYear()?" "+dd.getFullYear():""}`;
    return `<div class="day">${lab}</div><div class="group">${arr.map(txRow).join("")}</div>`;}).join("");
}
function txRow(t){
  const acc=accById(t.account)?.name||"";
  let title=esc(t.cat),sub=[t.note,acc].filter(Boolean).map(esc).join(" · "),amt;
  if(t.type==="transfer"){title="Перевод";sub=`${esc(acc)} → ${esc(accById(t.to)?.name||"")}`;amt=fmt(t.amount);}
  else if(t.type==="adjust"){title="Корректировка";sub=esc(acc);amt=fmt(t.delta||0,true);}
  else amt=(t.type==="income"?"+":"−")+fmt(t.amount);
  const sel=S.sel.has(t.id);
  return `<div class="row${sel?" sel":""}" data-row="${esc(t.id)}"><div class="act"><button class="trash" data-del="${esc(t.id)}" aria-label="Удалить" tabindex="-1">${ICON.trash}</button></div>
    <button class="tx" data-id="${esc(t.id)}">${S.selecting?`<span class="chk">${ICON.ok}</span>`:""}<span class="ico">${catIcon(t.type,t.cat)}</span><span class="mid"><div class="t">${title}</div><div class="s">${sub||"&nbsp;"}</div></span><span class="amt ${t.type==="income"?"inc":""}">${amt}</span></button></div>`;
}

// ---------- swipe + select + delete ----------
let openRow=null;
function closeRow(){if(openRow){openRow.querySelector(".tx").style.transform="";openRow.classList.remove("open");openRow=null;}}
function wireTx(){
  document.querySelectorAll(".tx").forEach(b=>{
    const row=b.parentElement;let x0=0,y0=0,dx=0,drag=false,locked=null,startOff=0;
    b.addEventListener("touchstart",e=>{if(S.selecting)return;const p=e.touches[0];x0=p.clientX;y0=p.clientY;dx=0;locked=null;drag=false;startOff=openRow===row?-80:0;if(openRow&&openRow!==row)closeRow();},{passive:true});
    b.addEventListener("touchmove",e=>{if(S.selecting)return;const p=e.touches[0];const mx=p.clientX-x0,my=p.clientY-y0;
      if(locked===null&&(Math.abs(mx)>8||Math.abs(my)>8))locked=Math.abs(mx)>Math.abs(my);
      if(!locked)return;drag=true;dx=Math.max(Math.min(startOff+mx,0),-220);b.classList.add("drag");row.classList.add("dragging");b.style.transform=`translateX(${dx}px)`;},{passive:true});
    b.addEventListener("touchend",()=>{b.classList.remove("drag");row.classList.remove("dragging");if(!drag)return;
      if(dx<-170){deleteTxs([b.dataset.id]);return;}
      if(dx<-40){b.style.transform="translateX(-80px)";row.classList.add("open");openRow=row;}else{b.style.transform="";row.classList.remove("open");if(openRow===row)openRow=null;}
      b.dataset.moved="1";setTimeout(()=>delete b.dataset.moved,60);});
    b.onclick=()=>{if(b.dataset.moved)return;
      if(S.selecting){const id=b.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);row.classList.toggle("sel",S.sel.has(id));selBar();return;}
      if(openRow){closeRow();return;}const t=S.txs.find(x=>x.id===b.dataset.id);if(t)openForm(t);};
  });
  document.querySelectorAll("[data-del]").forEach(d=>d.onclick=()=>deleteTxs([d.dataset.del]));
}
document.addEventListener("touchstart",e=>{if(openRow&&!e.target.closest(".row"))closeRow();},{passive:true});
function enterSelect(){closeRow();S.selecting=true;S.sel.clear();$("selBtn").textContent="Готово";S.showAll=true;refreshList();selBar();}
function exitSelect(silent){if(!S.selecting)return;S.selecting=false;S.sel.clear();$("selbar").classList.remove("show");if(!silent){if($("selBtn"))$("selBtn").textContent="Выбрать";refreshList();}}
function selBar(){const n=S.sel.size;$("selCount").textContent=n?`Выбрано: ${n}`:"Выбери операции";$("selDel").disabled=!n;$("selbar").classList.add("show");}
$("selCancel").onclick=()=>exitSelect();
$("selDel").onclick=()=>{const ids=[...S.sel];exitSelect();deleteTxs(ids);};
async function deleteTxs(ids){
  if(!S.col||!ids.length)return;
  const items=ids.map(id=>S.txs.find(x=>x.id===id)).filter(Boolean);
  for(const t of items){const row=document.querySelector(`[data-row="${CSS.escape(t.id)}"]`);
    if(row&&!RM){row.style.height=row.offsetHeight+"px";row.querySelector(".tx").style.transform="translateX(-110%)";void row.offsetHeight;row.style.height="0px";row.style.opacity="0";}}
  openRow=null;
  setTimeout(async()=>{let ok=0;for(const t of items){try{await S.col.doc(t.id).delete();ok++;}catch{}}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||micBlocked){fallbackMic();return;}
  try{rec=new SR();rec.lang="ru-RU";rec.interimResults=true;rec.continuous=true;heard="";
    rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;heard=s;const ta=$("aiText");if(ta){ta.value=s;autosize();}};
    rec.onerror=e=>{const blocked=["not-allowed","service-not-allowed","audio-capture"].includes(e.error);rec=null;if(blocked){micBlocked=true;micUI();fallbackMic();}else micUI();};
    rec.onend=()=>{const txt=heard.trim();rec=null;micUI();if(txt&&!busy){const ta=$("aiText");if(ta){ta.value="";autosize();}runAI(txt,null);}};
    rec.start();micUI();if(navigator.vibrate)navigator.vibrate(10);

}

- Суммы словами и разговорные: «двести восемьдесят» = 280, «косарь/тыща» = 1000, «5к» = 5000, «полторы тысячи» = 1500.
- Дата: если не названа — сегодня; «вчера», «в пятницу» → дата не позже сегодня.

      const type=["income","expense","transfer"].includes(r.type)?r.type:"expense";
      const amount=Math.abs(num(r.amount));if(!(amount>0))continue;
      const tx={type,amount,account,note:String(r.note||"").slice(0,80),date};
      if(type==="transfer"){tx.to=accById(r.to)?r.to:(S.set.accounts.find(a=>a.id!==account)?.id||account);tx.cat="";}

    S.form=tx?{type:tx.type,amt:String(tx.amount).replace(".",","),cat:tx.cat,account:tx.account,to:tx.to,note:tx.note||"",date:tx.date}
      :{type:type||"expense",amt:"",cat:null,account:S.set.accounts[0].id,to:S.set.accounts[1]?.id,note:"",date:iso(new Date())};}
  go("add","push");

function openTransfer(edit){

  S.tr=edit?{from:edit.account,to:edit.to,amt:String(edit.amount).replace(".",","),note:edit.note||"",date:edit.date,edit}:{from:f,to:t,amt:"",note:"",date:iso(new Date()),edit:null};
  S.trPick=null;S.trDone=null;S.trBack=["more","accEdit"].includes(S.view)?S.view:"home";go("transfer","push");
}

    $("trGo").disabled=true;$("trGo").innerHTML='<span class="spin"></span>Перевожу…';

  $("kSave").onclick=()=>{save();toast("Сохранено");};
  $("kTest").onclick=async()=>{save();const r=$("kRes");r.innerHTML='<span class="spin"></span>Проверяю…';
    try{const sample=await claude.use("sample");const t0=performance.now();const res=await sample('Ответь одним словом: "работает"',{modelTier:"quick"});
      r.innerHTML=`✅ Работает за ${((performance.now()-t0)/1000).toFixed(1).replace(".",",")} с · модель ${esc(res.model||AICONF.model())}`;}
    catch(e){r.textContent="❌ "+(SAMPLE_ERR[e?.code]||e?.message||"Ошибка");}};
  $("bExp").onclick=async()=>{const data={format:"kb1",exported:new Date().toISOString(),data:LOCALDB.exportAll()};
    const name=`budget-backup-${iso(new Date())}.json`;const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});$("bRes").textContent="Копия готова.";return;}}catch(e){if(e?.name==="AbortError")return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();$("bRes").textContent="Копия сохранена.";};
  $("bImp").onclick=()=>$("bFile").click();
  $("bFile").onchange=async()=>{const f=$("bFile").files[0];$("bFile").value="";if(!f)return;
    try{const d=JSON.parse(await f.text());if(d.format!=="kb1"||!d.data)throw 0;LOCALDB.importAll(d.data);
      const n=Object.values(d.data).reduce((s,c)=>s+Object.keys(c).length,0);$("bRes").textContent=`Загружено записей: ${n}.`;toast("Копия загружена");}
    catch{$("bRes").textContent="Это не файл копии приложения.";}};
}

// ================= recurring auto-log =================
let recRunning=false;
async function runRecurring(){
  if(!S.col||recRunning)return;recRunning=true;let changed=false;
  for(const r of S.set.recurring){if(r.last===thisYm||today.getDate()<r.day)continue;
    try{await addTx({type:r.type,amount:r.amount,cat:r.cat,account:accById(r.account)?r.account:S.set.accounts[0].id,note:r.name+" · авто",date:`${thisYm}-${pad2(r.day)}`});r.last=thisYm;changed=true;}catch{}}
  if(changed)saveSet();recRunning=false;
}

// ================= boot =================
render("enter");
addEventListener("resize",moveTab);
setTimeout(()=>{let last=0;try{last=+localStorage.getItem("px:last")||0;}catch{}if(Date.now()-last>3*3600e3&&Object.values({...S.allSet,[S.pid]:S.set}).some(x=>(x.assets||[]).length))refreshPrices(true);},2500);
(async()=>{
  const db=await claude.use("db"),user=await claude.use("user");const uid=user?await user.id():null;
  if(!db||!uid){S.ready=true;render();note("Записи сохраняются, когда страница открыта в Claude под твоим аккаунтом.");return;}
  S.db=db;S.col=db.collection("data/users/"+uid);
  db.collection("prices").onSnapshot(snap=>{const p={};for(const d of snap.docs){const v=d.data();if(v&&v.price>0)p[d.id]=v;}S.prices=p;
    if(["invest","home","assetEdit"].includes(S.view)&&!busyTyping())render();},()=>{});
  let first=true;
  S.col.onSnapshot(snap=>{
    const txs=[],sets={};let prof=null;
    for(const d of snap.docs){const v=d.data();if(!v)continue;
      if(d.id==="profiles")prof=v;else if(d.id==="settings")sets.main=v;else if(d.id.startsWith("settings-"))sets[d.id.slice(9)]=v;
      else if(v.date&&(v.amount>0||v.type==="adjust"))txs.push({id:d.id,...v});}
    S.allTx=txs;S.allSet=sets;
    if(prof&&Array.isArray(prof.list)&&prof.list.length){S.profiles=prof.list;if(first&&prof.current&&prof.list.some(p=>p.id===prof.current))S.pid=prof.current;}
    if(!S.profiles.some(p=>p.id===S.pid))S.pid=S.profiles[0].id;
    applyProfile();S.ready=true;
    if(S.view==="home"){if(!busyTyping()&&!rec&&!openRow&&!S.selecting)render();else if(!openRow)refreshList();}
    else if(!["add","accEdit","assetEdit","profiles","transfer"].includes(S.view)&&!busyTyping())render();
    if(first&&!snap.metadata.fromCache){first=false;if(!sets[S.pid])saveSet();else writeWatch();runRecurring();}
  },()=>{S.ready=true;render();note("Не удалось загрузить записи. Обнови страницу.");});
})();
document.addEventListener("change",e=>{if(e.target.closest(".sw")&&navigator.vibrate)navigator.vibrate(6);});
function busyTyping(){const ae=document.activeElement;return ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT");}
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
